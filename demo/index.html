<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>glfm-mark 演示</title>
    <style>
      /* 独立演示页的局部基础样式，模拟 Material 的排版变量。 */
      :root {
        --md-default-bg-color: #ffffff;
        --md-default-fg-color: #1f1f1f;
        --md-default-fg-color--light: #6b6b6b;
        --md-default-fg-color--lightest: #d8d8d8;
        --md-primary-fg-color: #3f51b5;
        --md-primary-bg-color: #ffffff;
        --md-code-bg-color: #f5f5f5;
        --md-text-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
        --md-code-font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      [data-md-color-scheme='slate'] {
        --md-default-bg-color: #1e2129;
        --md-default-fg-color: #d7d7d7;
        --md-default-fg-color--light: #a0a0a0;
        --md-default-fg-color--lightest: #3a3d45;
        --md-primary-fg-color: #7c8cff;
        --md-primary-bg-color: #10121a;
        --md-code-bg-color: #262a33;
      }

      body {
        margin: 0;
        padding: 1.5rem;
        background: var(--md-default-bg-color);
        color: var(--md-default-fg-color);
        font-family: var(--md-text-font-family);
      }

      .demo-layout {
        max-width: 60rem;
        margin: 0 auto;
      }

      .demo-controls {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }

      .demo-controls button {
        font: inherit;
        font-size: 0.8rem;
        padding: 0.3rem 0.6rem;
        border: 1px solid var(--md-default-fg-color--lightest);
        border-radius: 4px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body data-md-color-scheme="default">
    <div class="demo-layout">
      <div class="demo-controls">
        <button type="button" onclick="document.body.dataset.mdColorScheme='default'">亮色</button>
        <button type="button" onclick="document.body.dataset.mdColorScheme='slate'">暗色</button>
      </div>
      <div id="app"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
